apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: inferencemodels.inference.networking.k8s.io
  annotations:
    api-approved.kubernetes.io: https://github.com/kubernetes-sigs/gateway-api-inference-extension
    gateway.networking.k8s.io/bundle: v0.0.0
spec:
  group: inference.networking.k8s.io
  scope: Namespaced
  names:
    kind: InferenceModel
    listKind: InferenceModelList
    plural: inferencemodels
    singular: inferencemodel
    shortNames:
      - infmodel
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - modelName
                - poolRef
              properties:
                modelName:
                  type: string
                  description: The model name clients request.
                criticality:
                  type: string
                  enum:
                    - Critical
                    - Standard
                  default: Standard
                poolRef:
                  type: object
                  required:
                    - name
                  properties:
                    group:
                      type: string
                    kind:
                      type: string
                    name:
                      type: string
                  description: Reference to the InferencePool this model is served from.
                targetModels:
                  type: array
                  items:
                    type: object
                    required:
                      - name
                    properties:
                      name:
                        type: string
                      weight:
                        type: integer
                  description: Optional backend model names this model maps onto.
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
