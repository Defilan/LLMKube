apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: inferencepools.inference.networking.k8s.io
  annotations:
    api-approved.kubernetes.io: https://github.com/kubernetes-sigs/gateway-api-inference-extension
    gateway.networking.k8s.io/bundle: v0.0.0
spec:
  group: inference.networking.k8s.io
  scope: Namespaced
  names:
    kind: InferencePool
    listKind: InferencePoolList
    plural: inferencepools
    singular: inferencepool
    shortNames:
      - infpool
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - selector
                - targetPorts
              properties:
                selector:
                  type: object
                  additionalProperties:
                    type: string
                  description: Labels used to match model-server pods in this namespace.
                targetPorts:
                  type: array
                  items:
                    type: object
                    required:
                      - number
                    properties:
                      number:
                        type: integer
                        minimum: 1
                        maximum: 65535
                  description: Ports the model servers listen on.
                appProtocol:
                  type: string
                  enum:
                    - http
                    - kubernetes.io/h2c
                  default: http
                endpointPickerRef:
                  type: object
                  required:
                    - name
                    - port
                  properties:
                    name:
                      type: string
                    namespace:
                      type: string
                    port:
                      type: object
                      required:
                        - number
                      properties:
                        number:
                          type: integer
                          minimum: 1
                          maximum: 65535
                  description: Reference to the Endpoint Picker service.
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
