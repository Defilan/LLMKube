# The AgentGateway data plane under the generated RBAC. A same-namespace
# Gateway (its listener carries no allowedRoutes, so the Same default admits
# the router), one InferenceService backend (an empty status is fine: the
# backend is ejected from the route's backendRefs, but the reconcile still
# generates the pool, the Gateway-wide AgentgatewayPolicy, and the HTTPRoute),
# and a ModelRouter in AgentGateway mode. This exercises inferencepools,
# agentgatewaypolicies, and httproutes create/update plus gateways get under
# the generated ClusterRole. Deleting the fixtures with the operator still
# running exercises owner-reference garbage collection of the three generated
# kinds, not the sweep: a same-namespace router's objects carry owner
# references, and the sweep's list/delete path exists for cross-namespace
# policies, which this fixture set cannot reach because kubectl apply -n
# cannot create the Gateway's namespace.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: rbac-agw-gateway
spec:
  gatewayClassName: rbac-e2e
  listeners:
  - name: http
    port: 80
    protocol: HTTP
---
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: rbac-agw-cpu
spec:
  modelRef: rbac-tiny
  replicas: 1
  image: registry.k8s.io/pause:3.10
  resources:
    gpu: 0
    cpu: 50m
    memory: 64Mi
---
apiVersion: inference.llmkube.dev/v1alpha1
kind: ModelRouter
metadata:
  name: rbac-agw-router
spec:
  dataPlane: AgentGateway
  agentGatewayRef:
    name: rbac-agw-gateway
    endpointPicker: rbac-epp
    endpointPickerPort: 9002
  backends:
  - name: local
    tier: local
    inferenceServiceRef:
      name: rbac-agw-cpu
  rules:
  - name: r
    match:
      models:
      - rbac-tiny
    route:
      backends:
      - local
---
# The same backend through agentGatewayRef.routing: Model. This exercises
# agentgatewaymodels create/update, and the lists every Model-mode reconcile
# runs to sweep the other mode's objects and the models of removed backends.
# Deleting it exercises owner-reference garbage collection of the route and
# the model, as for the router above.
apiVersion: inference.llmkube.dev/v1alpha1
kind: ModelRouter
metadata:
  name: rbac-agw-model-router
spec:
  dataPlane: AgentGateway
  agentGatewayRef:
    name: rbac-agw-gateway
    routing: Model
    sectionName: http
  backends:
  - name: local
    tier: local
    inferenceServiceRef:
      name: rbac-agw-cpu
