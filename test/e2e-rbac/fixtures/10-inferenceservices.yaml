# CPU InferenceServices. The serving image is the pause image on purpose: the
# controller makes its API calls (cache PVC, Deployment, Service, Pods, logs,
# status) whether or not llama-server ever starts, and pause keeps the run from
# pulling a multi-hundred-MB runtime image into kind.
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: rbac-cpu
spec:
  modelRef: rbac-tiny
  replicas: 1
  image: registry.k8s.io/pause:3.10
  resources:
    gpu: 0
    cpu: 50m
    memory: 64Mi
---
# Two members for the ModelPool in 30-modelpool.yaml.
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: rbac-pool-a
spec:
  modelRef: rbac-pvc
  replicas: 1
  image: registry.k8s.io/pause:3.10
  resources:
    gpu: 0
    cpu: 50m
    memory: 64Mi
---
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: rbac-pool-b
spec:
  modelRef: rbac-pvc
  replicas: 1
  image: registry.k8s.io/pause:3.10
  resources:
    gpu: 0
    cpu: 50m
    memory: 64Mi
