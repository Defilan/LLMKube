suite: router-proxy network policy
templates:
  - router-network-policy.yaml

tests:
  - it: renders no policies when networkPolicies is disabled
    asserts:
      - hasDocuments:
          count: 0

  - it: scopes the router-proxy metrics/admin listener to the controller-manager
    set:
      networkPolicies.enabled: true
    release:
      namespace: default
    asserts:
      - isKind:
          of: NetworkPolicy
      # Every router-proxy pod, regardless of ModelRouter name.
      - equal:
          path: spec.podSelector.matchExpressions[0].key
          value: inference.llmkube.dev/model-router
      - equal:
          path: spec.podSelector.matchExpressions[0].operator
          value: Exists
      # The inference data plane has no source restriction.
      - notExists:
          path: spec.ingress[0].from
      - contains:
          path: spec.ingress[0].ports
          content:
            protocol: TCP
            port: 8080
      # The metrics/admin listener is reachable from the controller-manager and
      # from the Prometheus scrape source (the rule below).
      - contains:
          path: spec.ingress[1].from
          content:
            namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: default
            podSelector:
              matchLabels:
                control-plane: controller-manager
      - contains:
          path: spec.ingress[1].ports
          content:
            protocol: TCP
            port: 9090

  - it: allows the Prometheus scrape namespace on the metrics listener
    set:
      networkPolicies.enabled: true
    asserts:
      - isKind:
          of: NetworkPolicy
      # The PodMonitor scrapes 9090 from Prometheus, which is not the
      # controller-manager; without this rule the scrape is denied.
      - contains:
          path: spec.ingress[2].from
          content:
            namespaceSelector:
              matchExpressions:
                - key: kubernetes.io/metadata.name
                  operator: In
                  values:
                    - monitoring
      - contains:
          path: spec.ingress[2].ports
          content:
            protocol: TCP
            port: 9090

  - it: omits the scrape-namespace rule when the list is empty
    set:
      networkPolicies.enabled: true
      networkPolicies.metricsScrapeNamespaces: []
    asserts:
      - lengthEqual:
          path: spec.ingress
          count: 2
