suite: metal relay token Secret create policy
# Only the controller's ServiceAccount may CREATE llmkube-metal-relay (#1957).
# The policy needs a cluster that serves ValidatingAdmissionPolicy, so cases
# that expect it declare that API in capabilities.apiVersions, as a real
# install gets it from discovery.
templates:
  - metal-relay-secret-policy.yaml

tests:
  - it: renders the policy and a Deny binding by default
    capabilities:
      apiVersions:
        - admissionregistration.k8s.io/v1/ValidatingAdmissionPolicy
    release:
      name: rel
      namespace: llmkube-system
    asserts:
      - hasDocuments:
          count: 2
      - isKind:
          of: ValidatingAdmissionPolicy
        documentIndex: 0
      - equal:
          path: metadata.name
          value: rel-llmkube-metal-relay-secret
        documentIndex: 0
      - equal:
          path: spec.failurePolicy
          value: Fail
        documentIndex: 0
      - equal:
          path: spec.matchConstraints.resourceRules
          value:
            - apiGroups: [""]
              apiVersions: ["v1"]
              operations: ["CREATE"]
              resources: ["secrets"]
        documentIndex: 0
      - equal:
          path: spec.matchConditions[0].expression
          value: has(object.metadata.name) && object.metadata.name == 'llmkube-metal-relay'
        documentIndex: 0
      - equal:
          path: spec.validations[0].expression
          value: request.userInfo.username == 'system:serviceaccount:llmkube-system:rel-llmkube-controller-manager'
        documentIndex: 0
      - matchRegex:
          path: spec.validations[0].message
          pattern: ^Secret llmkube-metal-relay may only be created by the LLMKube controller; delete it
        documentIndex: 0
      - isKind:
          of: ValidatingAdmissionPolicyBinding
        documentIndex: 1
      - equal:
          path: spec.policyName
          value: rel-llmkube-metal-relay-secret
        documentIndex: 1
      - equal:
          path: spec.validationActions
          value: [Deny]
        documentIndex: 1
      # All namespaces: no namespace or object selector narrows the binding.
      - notExists:
          path: spec.matchResources
        documentIndex: 1

  - it: names the release namespace and an overridden ServiceAccount
    capabilities:
      apiVersions:
        - admissionregistration.k8s.io/v1/ValidatingAdmissionPolicy
    release:
      name: rel
      namespace: ops
    set:
      serviceAccount.name: custom-sa
    asserts:
      - equal:
          path: spec.validations[0].expression
          value: request.userInfo.username == 'system:serviceaccount:ops:custom-sa'
        documentIndex: 0

  - it: renders nothing when disabled
    capabilities:
      apiVersions:
        - admissionregistration.k8s.io/v1/ValidatingAdmissionPolicy
    set:
      metalRelay.secretCreatePolicy.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: renders nothing on a cluster without ValidatingAdmissionPolicy
    asserts:
      - hasDocuments:
          count: 0
