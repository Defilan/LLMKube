suite: extraObjects renders operator-supplied manifests
templates:
  - extra-objects.yaml

tests:
  - it: renders nothing by default
    asserts:
      - hasDocuments:
          count: 0

  - it: renders a map entry as a Kubernetes object
    set:
      extraObjects:
        - apiVersion: storage.k8s.io/v1
          kind: StorageClass
          metadata:
            name: llmkube-model-cache
          provisioner: file.csi.azure.com
          parameters:
            skuName: Premium_LRS
          mountOptions: [mfsymlinks, actimeo=30, nosharesock, cache=loose]
          reclaimPolicy: Delete
          volumeBindingMode: Immediate
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: StorageClass
      - equal:
          path: metadata.name
          value: llmkube-model-cache
      - equal:
          path: provisioner
          value: file.csi.azure.com
      - contains:
          path: mountOptions
          content: cache=loose

  # `tpl` must run after `toYaml`, so a map item can template its own fields.
  - it: renders a map entry whose fields use chart templating
    set:
      extraObjects:
        - apiVersion: v1
          kind: ConfigMap
          metadata:
            name: "{{ .Release.Name }}-extra"
    asserts:
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.name
          value: RELEASE-NAME-extra

  # A string item is tpl'd verbatim, with the same chart-value access, and is
  # how a manifest uses template control flow.
  - it: renders a string entry through tpl
    set:
      extraObjects:
        - |
          apiVersion: v1
          kind: Secret
          metadata:
            name: {{ .Release.Name }}-extra
          stringData:
            token: {{ .Values.namespace }}
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: RELEASE-NAME-extra
      - equal:
          path: stringData.token
          value: llmkube-system

  - it: renders multiple entries in order
    set:
      extraObjects:
        - apiVersion: v1
          kind: ConfigMap
          metadata:
            name: first
        - apiVersion: v1
          kind: Secret
          metadata:
            name: second
    asserts:
      - hasDocuments:
          count: 2
      - isKind:
          of: ConfigMap
        documentIndex: 0
      - isKind:
          of: Secret
        documentIndex: 1

  - it: a string entry can use template control flow to omit itself
    set:
      extraObjects:
        - |
          {{- if .Values.networkPolicies.enabled }}
          apiVersion: networking.k8s.io/v1
          kind: NetworkPolicy
          metadata:
            name: {{ .Release.Name }}-extra
          spec:
            podSelector: {}
            policyTypes: [Ingress]
          {{- end }}
    asserts:
      - hasDocuments:
          count: 0

  - it: a string entry can use template control flow to emit itself
    set:
      networkPolicies.enabled: true
      extraObjects:
        - |
          {{- if .Values.networkPolicies.enabled }}
          apiVersion: networking.k8s.io/v1
          kind: NetworkPolicy
          metadata:
            name: {{ .Release.Name }}-extra
          spec:
            podSelector: {}
            policyTypes: [Ingress]
          {{- end }}
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: NetworkPolicy
