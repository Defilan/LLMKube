{{- /*
Only the controller may CREATE the per-namespace Metal relay token Secret
(llmkube-metal-relay). Someone who can create Secrets in a namespace but not
read them could otherwise plant a token they know before the controller
creates one, and the relay and metal-agent would trust it (#1957).

UPDATE and DELETE are deliberately not matched: operators rotate the token by
updating the Secret in place and revoke it by deleting it. Clusters without
ValidatingAdmissionPolicy (Kubernetes older than 1.30) skip this and rely on
RBAC for Secret create. The controller and metal-agent label checks only
catch a Secret created before this policy or by hand by mistake: an attacker
can set the label too.

The matchCondition guards with has(): with failurePolicy Fail, an evaluation
error would deny every Secret CREATE in the cluster.
*/ -}}
{{- if and .Values.metalRelay.secretCreatePolicy.enabled (.Capabilities.APIVersions.Has "admissionregistration.k8s.io/v1/ValidatingAdmissionPolicy") }}
{{- $name := include "llmkube.resourceName" (dict "root" $ "suffix" "-metal-relay-secret") }}
{{- $controller := printf "system:serviceaccount:%s:%s" (include "llmkube.namespace" .) (include "llmkube.serviceAccountName" .) }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $name }}
  labels:
    {{- include "llmkube.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups: [""]
      apiVersions: ["v1"]
      operations: ["CREATE"]
      resources: ["secrets"]
  matchConditions:
  - name: metal-relay-secret
    expression: has(object.metadata.name) && object.metadata.name == 'llmkube-metal-relay'
  validations:
  - expression: request.userInfo.username == {{ $controller | squote }}
    message: >-
      Secret llmkube-metal-relay may only be created by the LLMKube controller;
      delete it and the controller recreates it (#1957)
    reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ $name }}
  labels:
    {{- include "llmkube.labels" . | nindent 4 }}
spec:
  policyName: {{ $name }}
  validationActions: [Deny]
{{- end }}
