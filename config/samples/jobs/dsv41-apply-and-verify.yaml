# Verify the vision flip on the three-Spark DeepSeek-V4.1-Flash EXL3 ring from a Job that outlives the
# operator session. Applying the changed InferenceService terminates the ring, which is also the endpoint the
# session that applied it is running on; so the wait and the smoke are done here, on-cluster, and their result
# is read from this Job's logs after reconnecting.
#
# The readiness gate is the vision request itself, not a Kubernetes readiness signal: the existing Job
# pattern in this directory (drop-page-cache.yaml, dsv41-tp3-config.yaml) carries no API access, so this Job
# needs no ServiceAccount and no RBAC. It polls the OpenAI endpoint at 15 s until a text completion answers
# (the ring is back), then retries the vision request until the model names the stripes left to right.
#
# Usage: kubectl create -f dsv41-apply-and-verify.yaml
#        kubectl logs -f job/dsv41-apply-and-verify
# The embedded PNG is 90x30, three vertical stripes red / green / blue; the expected answer is known exactly,
# which is what makes the colour assertion a real gate rather than a smoke.
apiVersion: batch/v1
kind: Job
metadata: {name: dsv41-apply-and-verify, namespace: default}
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      tolerations: [{key: nvidia.com/gpu, operator: Exists, effect: NoSchedule}]
      containers:
        - name: verify
          image: python:3.12-slim
          command: ["python3", "-u", "-c"]
          args:
            - |
              import json, time, urllib.request, sys

              BASE = "http://dsv41-exl3-ring.default.svc.cluster.local:8080/v1/chat/completions"
              MODEL = "DeepSeek-V4.1-Flash-EXL3"
              IMG = "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAFoAAAAeCAIAAAAjA54vAAAAQ0lEQVR42u3QsQkAMAzAMP//dHpFCAWBZw9qaql+XOPAgQMHDhw4cODAgQMHDhw4cODAgQMHDhw4cODAgQMHDhw36wd5i4ILfk+OkgAAAABJRU5ErkJggg=="

              def post(payload, timeout=180):
                  data = json.dumps(payload).encode()
                  req = urllib.request.Request(BASE, data=data, headers={"Content-Type": "application/json"})
                  with urllib.request.urlopen(req, timeout=timeout) as r:
                      return json.loads(r.read().decode())

              def text():
                  return post({"model": MODEL, "max_tokens": 8,
                               "messages": [{"role": "user", "content": "Reply with the word ok."}]})

              # The ring restarts under this Job; wait for it to answer a text completion at all.
              deadline = time.time() + 3600
              ready = False
              while time.time() < deadline:
                  try:
                      if text().get("choices"):
                          ready = True
                          break
                  except Exception as e:
                      print("waiting for ring:", e, flush=True)
                  time.sleep(15)
              if not ready:
                  print("VISION FAIL: ring did not answer a text completion within 60 min")
                  sys.exit(1)
              print("TEXT PASS: ring answered a completion", flush=True)

              # Vision: retry until the reply names the stripes left to right.
              deadline = time.time() + 900
              last = ""
              while time.time() < deadline:
                  try:
                      r = post({"model": MODEL, "max_tokens": 64,
                                "messages": [{"role": "user", "content": [
                                    {"type": "text",
                                     "text": "Name the three colours in this image, left to right, one word each."},
                                    {"type": "image_url", "image_url": {"url": IMG}}]}]})
                      last = (r["choices"][0]["message"]["content"] or "").strip()
                      low = last.lower()
                      print("vision reply:", repr(last[:200]), flush=True)
                      if ("red" in low and "green" in low and "blue" in low
                              and low.index("red") < low.index("green") < low.index("blue")):
                          print("VISION PASS")
                          sys.exit(0)
                  except Exception as e:
                      print("vision retry:", e, flush=True)
                  time.sleep(15)
              print("VISION FAIL: last output", repr(last))
              sys.exit(1)
          resources: {requests: {cpu: 500m, memory: 256Mi}, limits: {memory: 512Mi}}
