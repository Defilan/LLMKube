# Drop the page cache on NODE right before the group boots. After a 460 GB prestage most of the
# Spark's unified memory is page cache, and vLLM's worker refuses to start when CUDA-free at its
# init snapshot is below gpu-memory-utilization x total (bot-lab-21's launcher gates on exactly
# this and drops caches first; a member with 96.08 GiB free failed the 97.35 GiB gate). CUDA-free on GB10 tracks MemFree.
# Privileged hostPath write of "3" to drop_caches; prints MemFree before and after. One Job per node.
# Usage: for n in <member nodes>; do sed "s/NODE/$n/g" drop-page-cache.yaml | kubectl apply -f -; done
apiVersion: batch/v1
kind: Job
metadata: {name: drop-page-cache-NODE, namespace: default}
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: Never
      nodeName: NODE
      tolerations: [{key: nvidia.com/gpu, operator: Exists, effect: NoSchedule}]
      containers:
        - name: drop
          image: busybox:1.36
          securityContext: {privileged: true}
          command: ["sh", "-c"]
          args:
            - |
              b=$(awk '/MemFree/{print int($2/1048576)}' /proc/meminfo); sync; echo 3 > /host-drop_caches; sleep 2
              a=$(awk '/MemFree/{print int($2/1048576)}' /proc/meminfo); echo "MemFree GiB before=$b after=$a"
          resources: {requests: {cpu: 100m, memory: 32Mi}, limits: {memory: 128Mi}}
          volumeMounts: [{name: dc, mountPath: /host-drop_caches}]
      volumes: [{name: dc, hostPath: {path: /proc/sys/vm/drop_caches, type: File}}]
