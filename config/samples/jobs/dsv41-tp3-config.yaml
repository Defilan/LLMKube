# TP3 config edit on NODE, exactly what tonyd2wild's exl3/tools/reddie_prep_tp3.sh writes into the
# "72-head TP3 copy": text_config.num_attention_heads 64 -> 72, o_groups 8 -> 9, and virtual_heads_from
# {64, 8} at BOTH the text_config and top level (virtual_heads.py reads whichever it can getattr; on this
# build text_config is dict-like, so the top-level copy is the one that lands). Done in place on the
# staged checkpoint because vLLM's dict-form --hf-overrides replaces a dict-typed sub-config wholesale
# (measured: "text_config ... does not have num_attention_heads"). Idempotent; keeps config.json.orig-hf.
# NOTE: a prestage re-run sees config.json's size differ from HF and re-fetches it; re-run this after.
# Usage: for n in <member nodes>; do sed "s/NODE/$n/g" dsv41-tp3-config.yaml | kubectl apply -f -; done
apiVersion: batch/v1
kind: Job
metadata: {name: dsv41-tp3-config-NODE, namespace: default}
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      nodeName: NODE
      tolerations: [{key: nvidia.com/gpu, operator: Exists, effect: NoSchedule}]
      containers:
        - name: edit
          image: vllm/vllm-openai@sha256:d84a123255b822fc22508635218000187221794f59c0694c33b0650d1e377d58
          command: ["python3", "-c"]
          args:
            - |
              import json, os, shutil
              p = "/vm/bot-lab-21/DeepSeek-V4.1-Flash-EXL3-3.5bpw-Pollard/22fa141368a3262a/config.json"
              c = json.load(open(p)); tc = c["text_config"]
              if tc.get("num_attention_heads") == 72 and tc.get("o_groups") == 9 and c.get("virtual_heads_from"):
                  print("already TP3:", tc["num_attention_heads"], tc["o_groups"], c["virtual_heads_from"]); raise SystemExit(0)
              assert tc["num_attention_heads"] == 64 and tc["o_groups"] == 8, (tc["num_attention_heads"], tc["o_groups"])
              if not os.path.exists(p + ".orig-hf"): shutil.copy2(p, p + ".orig-hf")
              tc["num_attention_heads"] = 72; tc["o_groups"] = 9
              src = {"num_attention_heads": 64, "o_groups": 8}; tc["virtual_heads_from"] = src; c["virtual_heads_from"] = src
              c["kai_tp3_virtual_heads"] = "64 real heads / 8 o_groups padded to 72 / 9 for tensor-parallel 3 (virtual_heads.py)"
              json.dump(c, open(p, "w"), indent=1)
              print("TP3 config.json written: heads", tc["num_attention_heads"], "o_groups", tc["o_groups"], "size", os.path.getsize(p))
          resources: {requests: {cpu: 250m, memory: 256Mi}, limits: {memory: 1Gi}}
          volumeMounts: [{name: vm, mountPath: /vm}]
      volumes: [{name: vm, hostPath: {path: /var/lib/vllm-models, type: Directory}}]
