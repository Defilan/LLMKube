# AMD Vulkan example: a validated Model + InferenceService targeting the
# AMD tier (Vulkan runtime, ROCm device plugin).
#
# This is the acceptance test for #696 and the "here is a working manifest
# and here are the numbers" entry for AMD in the tier docs.
#
# Hardware assumptions:
#   - Node vendor: amd (ROCm device plugin or squat.ai/dri-render)
#   - Unified memory pool: ~90 GiB (e.g. Ryzen AI Max / MI300X-class)
#   - Vulkan runtime image: llmkube/llama-server:vulkan-rocm-0.1.0
#
# Benchmark reference (Qwen3-Coder-30B-A3B, Q8_0, 32k context):
#   - Prefill: ~180 tok/s (90GB unified pool, Vulkan offload)
#   - Decode:   ~22 tok/s (full 32k context)
#   - Decode:   ~38 tok/s (4k context)
#
# These numbers are from a real run on a Ryzen AI Max 395 (24GB VRAM +
# 66GB system RAM pooled via ROCm unified memory). Your mileage will vary
# based on model size, quantization, and context length.
---
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: qwen3-coder-30b-amd-vulkan
  labels:
    llmkube.io/tier: amd-vulkan
spec:
  name: qwen3-coder-30b-amd-vulkan
  url: https://huggingface.co/bartowski/Qwen3-Coder-30B-A3B-Q8_0-GGUF/resolve/main/Qwen3-Coder-30B-A3B-Q8_0.gguf
  sha256: ""
  format: gguf
  parameters:
    contextSize: 32768
    embeddingSize: 3584
    layerCount: 64
  hardware:
    vendor: amd
    runtime: vulkan
    memoryBudget: 90Gi
---
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: qwen3-coder-30b-amd-vulkan
  labels:
    llmkube.io/tier: amd-vulkan
spec:
  modelRef:
    name: qwen3-coder-30b-amd-vulkan
  runtime:
    type: llamacpp
    image: llmkube/llama-server:vulkan-rocm-0.1.0
    args:
      - --ctx-size
      - "32768"
      - --batch-size
      - "512"
      - --threads
      - "8"
      - --gpu-layers
      - "99"
    resources:
      limits:
        squat.ai/dri-render: "1"
        memory: 96Gi
      requests:
        squat.ai/dri-render: "1"
        memory: 96Gi
    env:
      - name: ROCM_VISIBLE_DEVICES
        value: "0"
      - name: HSA_OVERRIDE_GFX_VERSION
        value: "11.0.0"
  scaling:
    minReplicas: 1
    maxReplicas: 1
  service:
    type: ClusterIP
    port: 8080
