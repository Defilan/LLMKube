# The same model straight from Hugging Face, for clusters without a lab object store. Same 54 files;
# the operator fetches them into the cache claim at first start.
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: dsv41-flash-exl3-hf
spec:
  source: hf://bot-lab-21/DeepSeek-V4.1-Flash-EXL3-3.5bpw-Pollard
  format: safetensors
  quantization: exl3
  refreshPolicy: IfNotPresent
  hardware:
    accelerator: cuda
    gpu: {enabled: true, count: 1, vendor: nvidia}
