# One model across two DGX Sparks (GB10) over their ConnectX-7 RoCE link, with
# vLLM tensor parallel 2 + expert parallel (#1423). Measured 2026-09-02 on the
# Shadowstack ring with DeepSeek-V4-Flash-Vision-Exp: 2,089 tok/s prefill,
# 24.0 tok/s single-stream decode. Each member reads the weights from its own
# claim because the cluster has no ReadWriteMany class; both claims must exist.
#
# The fabric block is per member on purpose: the same cable has a different
# NIC and HCA name at each end. rdmaResource is the RDMA shared device plugin's
# extended resource; it adds CAP_IPC_LOCK so NCCL can pin memory.
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: dsv4-vision-ring
spec:
  modelRef: deepseek-v4-flash-vision-exp
  runtime: vllm
  image: vllm/vllm-openai:deepseekv4-flash-vision-arm64-cu130
  resources:
    gpu: 1
    memory: 110Gi
    cpu: "8"
  vllmConfig:
    tensorParallelSize: 2
    pipelineParallelSize: 1
    enableExpertParallel: true
    kvCacheDtype: fp8_e4m3
    maxModelLen: 262144
  extraArgs:
    - --reasoning-parser
    - deepseek_v4
    - --tool-call-parser
    - deepseek_v4
    - --enable-auto-tool-choice
    - --max-num-seqs
    - "2"
  env:
    - name: HF_HUB_OFFLINE
      value: "1"
    - name: PYTORCH_CUDA_ALLOC_CONF
      value: expandable_segments:True
  multiNode:
    rdmaResource: rdma/rdma_shared_device_a
    ibGIDIndex: 3
    members:
      - node: ahazidgx3
        fabric:
          address: 10.10.4.1
          socketInterface: enp1s0f0np0
          ibHCA: rocep1s0f0
        modelCache:
          claimName: dsv4-vision-dgx3
      - node: ahazidgx1
        fabric:
          address: 10.10.4.2
          socketInterface: enp1s0f1np1
          ibHCA: rocep1s0f1
        modelCache:
          claimName: dsv4-vision-dgx1
