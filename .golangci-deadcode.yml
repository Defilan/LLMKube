# Dead-production-code guard.
#
# The main .golangci.yml analyses test files, so a symbol referenced ONLY by
# its own tests counts as used. That is how eight fully unit-tested rails
# merged into pkg/foreman/agent without a single production caller: the tests
# kept `unused` quiet, and every gate passed. This config drops test files
# from the graph, so a symbol that nothing in production calls is reported.
#
# Run it with `make lint-deadcode`.
#
# The two registers below are debt, not policy. Both should shrink to empty.
version: "2"
run:
  # The whole point. Test-only references must not count as uses.
  tests: false
linters:
  default: none
  enable:
    - unused
  exclusions:
    rules:
      # ---------------------------------------------------------------
      # REGISTER A: merged, unit-tested, never wired into the pipeline.
      # The code exists and does nothing. Delete the entry in the same PR
      # that wires the rail up; that deletion is the proof it is live.
      # Do NOT add entries here. A new file in this list is new dead code.
      # ---------------------------------------------------------------
      - path: pkg/foreman/agent/mcp_audit\.go # Refs #1331
        linters: [unused]
      - path: pkg/foreman/agent/cross_stage\.go # Refs #1549
        linters: [unused]
      - path: pkg/foreman/agent/staleness_check\.go # Refs #1550
        linters: [unused]
      - path: pkg/foreman/agent/deleted_reference_gate\.go # Refs #1553
        linters: [unused]
      - path: pkg/foreman/agent/mutation_check\.go # Refs #1555
        linters: [unused]
      - path: pkg/foreman/agent/reviewer_diff_gate\.go # Refs #1570
        linters: [unused]
      # Whole file is unreferenced: the proposal-1075 work-class buckets
      # (classifyFile, classifyFootprint and their tables) landed in #1254
      # and nothing calls them.
      - path: pkg/foreman/agent/workclass\.go # Refs #1075
        linters: [unused]

      # ---------------------------------------------------------------
      # REGISTER B: symbols the guard reports that are staged rather than
      # reachable. #1602 triaged the four originally recorded here:
      # metalReadyEndpoints, isNeedsVerificationCoder and taskSucceeded
      # were deleted (each duplicated logic already inlined at its call
      # site, or was test-only by construction); parseMaxUSD stays, below.
      # ---------------------------------------------------------------
      # internal/router/budget.go is an entirely dead file: nothing in
      # production constructs a router.BudgetRule, so BudgetStore,
      # NewBudgetStore and Charge have no non-test callers. It is staged
      # for the ModelRouter budget work (#434, #440).
      #
      # parseMaxUSD is the only symbol in it the `unused` linter reports.
      # The file's other unexported symbols (bucket, bucketDuration,
      # usedInWindow, charge) are reachable from the exported entry points,
      # so the linter counts them used even though nothing outside the file
      # calls those either. Do NOT delete parseMaxUSD to clear this entry:
      # `unused` does not report exported identifiers, so removing the one
      # symbol it does report would leave the whole dead file invisible.
      #
      # Scoped to the SYMBOL, not the file, on purpose. Verified: with a
      # file-wide rule, adding a dead unexported helper to budget.go gives
      # 0 issues; with this symbol-scoped rule it is reported. A file-wide
      # suppression would swallow exactly the debt this guard exists to
      # surface, for instance a helper left dead when #434/#440 partially
      # wires the engine.
      - path: internal/router/budget\.go  # Refs #434, #440
        linters: [unused]
        text: parseMaxUSD
